import org.jetbrains.kotlin.gradle.dsl.JvmTarget
import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
    id "org.jetbrains.kotlin.jvm" version "2.4.21"
}

version = project.mod_version
group = project.maven_group

configurations {
    transitiveInclude
}

base {
    archivesName = project.archives_base_name
}

loom {
    accessWidenerPath = file("src/main/resources/screenshot.accesswidener")
}

repositories {
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
}

dependencies {
    implementation(transitiveInclude("io.ktor:ktor-server-content-negotiation-jvm:$ktor_version"))
    implementation(transitiveInclude("io.ktor:ktor-server-core-jvm:$ktor_version"))
    implementation(transitiveInclude("io.ktor:ktor-serialization-jackson-jvm:$ktor_version"))
    implementation(transitiveInclude("io.ktor:ktor-server-jetty-jakarta:$ktor_version"))
    implementation(transitiveInclude("io.ktor:ktor-server-cors:$ktor_version"))
    implementation(transitiveInclude("org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm:1.10.2"))

    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation "net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}"

    // Sodium is optional: its mixins only apply when it is loaded (see ScreenshotMixinPlugin)
    compileOnly "maven.modrinth:AANobbMI:mc26.3-0.9.3-beta.1-fabric"

    configurations.transitiveInclude.resolvedConfiguration.resolvedArtifacts.each { artifact ->
        def name = artifact.id.getComponentIdentifier().displayName

        if (name.contains("ktor") || name.contains("jetty") || name.contains("jakarta") || name.contains("javax")) {
            include name
        }
    }
}


processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release.set(25)
}

tasks.withType(KotlinCompile).configureEach {
    compilerOptions.jvmTarget = JvmTarget.JVM_25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}